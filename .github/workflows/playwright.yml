name: Playwright Tests & Allure Report

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Clean previous Allure results
              run: rm -rf allure-results allure-report

            - name: Run Playwright tests
              run: npx playwright test
              continue-on-error: true

            - name: Install Allure CLI
              if: always()
              run: |
                  wget -q https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
                  tar -xzf allure-2.29.0.tgz

            - name: Generate Allure report
              if: always()
              run: |
                  ./allure-2.29.0/bin/allure generate allure-results --clean -o allure-report
                  touch allure-report/.nojekyll

            - name: Upload GitHub Pages artifact
              if: always()
              uses: actions/upload-pages-artifact@v3
              with:
                  path: allure-report

    deploy:
        if: github.event_name == 'push'
        needs: test
        runs-on: ubuntu-latest

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
